<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Radiator design requirements</title>
  <desc id="desc">Zero-speed air volume flow and ideal vehicle-speed face-flow bounds alongside required ideal UA for the two hot-weather propulsion cases.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Radiator design requirements</text>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">A<tspan baseline-shift="sub" font-size="10">core</tspan>v is an ideal geometric face-flow bound</text>

  <g font-family="Arial, sans-serif">
    <text x="315" y="83" text-anchor="middle" font-size="17" font-weight="700">Air-side requirement</text>
    <line x1="70" y1="430" x2="570" y2="430" stroke="#374151"/>
    <line x1="70" y1="90" x2="70" y2="430" stroke="#374151"/>
    <g fill="#6b7280" font-size="11" text-anchor="end">
      <text x="62" y="434">0</text><text x="62" y="366">0.2</text><text x="62" y="298">0.4</text>
      <text x="62" y="230">0.6</text><text x="62" y="162">0.8</text><text x="62" y="94">1.0</text>
    </g>
    <g stroke="#e5e7eb">
      <line x1="70" y1="362" x2="570" y2="362"/><line x1="70" y1="294" x2="570" y2="294"/>
      <line x1="70" y1="226" x2="570" y2="226"/><line x1="70" y1="158" x2="570" y2="158"/>
      <line x1="70" y1="90" x2="570" y2="90"/>
    </g>
    <text x="20" y="260" text-anchor="middle" font-size="13" transform="rotate(-90 20 260)">Air volume flow (m³/s)</text>
    <rect x="150" y="383" width="48" height="47" fill="#0072BD"/>
    <rect x="205" y="311" width="48" height="119" fill="#D95319"/>
    <rect x="365" y="346" width="48" height="84" fill="#0072BD"/>
    <rect x="420" y="114" width="48" height="316" fill="#D95319"/>
    <g font-size="11" text-anchor="middle" fill="#111827">
      <text x="201" y="454">Low-speed hot-weather grade</text>
      <text x="416" y="454">Sustained 10% grade</text>
    </g>
    <g font-size="11" fill="#111827">
      <rect x="88" y="105" width="16" height="12" fill="#0072BD"/><text x="111" y="115">Required air flow at zero road speed</text>
      <rect x="88" y="126" width="16" height="12" fill="#D95319"/><text x="111" y="136">Ideal geometric face-flow bound</text>
    </g>

    <text x="900" y="83" text-anchor="middle" font-size="17" font-weight="700">Candidate-core thermal requirement</text>
    <line x1="650" y1="430" x2="1150" y2="430" stroke="#374151"/>
    <line x1="650" y1="90" x2="650" y2="430" stroke="#374151"/>
    <g fill="#6b7280" font-size="11" text-anchor="end">
      <text x="642" y="434">0</text><text x="642" y="358">50</text><text x="642" y="283">100</text>
      <text x="642" y="207">150</text><text x="642" y="132">200</text>
    </g>
    <g stroke="#e5e7eb">
      <line x1="650" y1="354" x2="1150" y2="354"/><line x1="650" y1="279" x2="1150" y2="279"/>
      <line x1="650" y1="203" x2="1150" y2="203"/><line x1="650" y1="128" x2="1150" y2="128"/>
    </g>
    <text x="605" y="260" text-anchor="middle" font-size="13" transform="rotate(-90 605 260)">Required ideal UA (W/K)</text>
    <rect x="735" y="262" width="120" height="168" fill="#0072BD"/>
    <rect x="945" y="121" width="120" height="309" fill="#0072BD"/>
    <g font-size="12" text-anchor="middle" fill="#111827">
      <text x="795" y="253">111.3</text><text x="1005" y="112">204.8</text>
    </g>
    <g font-size="11" text-anchor="middle" fill="#111827">
      <text x="795" y="454">Low-speed hot-weather grade</text>
      <text x="1005" y="454">Sustained 10% grade</text>
    </g>
  </g>
</svg>
