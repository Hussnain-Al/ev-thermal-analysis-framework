<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Radiator requirement sensitivity</title>
  <desc id="desc">Required candidate-core face velocity and ideal UA versus assumed air temperature rise for the sustained-grade and low-speed hot-weather cases. The chart does not predict fan or radiator performance.</desc>
  <rect width="1200" height="520" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#111827">
    <text x="600" y="31" text-anchor="middle" font-size="22" font-weight="700">Radiator requirement sensitivity</text>
    <text x="600" y="53" text-anchor="middle" font-size="13" fill="#4b5563">Calculated requirements only — achieved core and fan performance are not predicted</text>

    <text x="325" y="82" text-anchor="middle" font-size="17" font-weight="700">Air-side flow requirement</text>
    <line x1="90" y1="420" x2="560" y2="420" stroke="#374151"/>
    <line x1="90" y1="90" x2="90" y2="420" stroke="#374151"/>
    <g stroke="#e5e7eb"><line x1="90" y1="369" x2="560" y2="369"/><line x1="90" y1="318" x2="560" y2="318"/><line x1="90" y1="268" x2="560" y2="268"/><line x1="90" y1="217" x2="560" y2="217"/><line x1="90" y1="166" x2="560" y2="166"/><line x1="90" y1="115" x2="560" y2="115"/></g>
    <g font-size="11" fill="#6b7280" text-anchor="end"><text x="82" y="424">0</text><text x="82" y="373">1</text><text x="82" y="322">2</text><text x="82" y="272">3</text><text x="82" y="221">4</text><text x="82" y="170">5</text><text x="82" y="119">6</text></g>
    <g font-size="11" fill="#6b7280" text-anchor="middle"><text x="90" y="440">5</text><text x="184" y="440">7</text><text x="278" y="440">9</text><text x="372" y="440">11</text><text x="466" y="440">13</text><text x="560" y="440">15</text></g>
    <text x="325" y="466" text-anchor="middle" font-size="13">Assumed air temperature rise (°C)</text>
    <text x="26" y="255" text-anchor="middle" font-size="13" transform="rotate(-90 26 255)">Required core-face velocity (m/s)</text>
    <line x1="325" y1="90" x2="325" y2="420" stroke="#6b7280" stroke-dasharray="5 5"/><text x="331" y="105" font-size="11" fill="#6b7280">10°C baseline</text>
    <polyline points="90,119 137,169 184,205 231,232 278,253 325,269 372,283 419,295 466,304 513,312 560,320" fill="none" stroke="#0072BD" stroke-width="3"/>
    <polyline points="90,252 137,280 184,300 231,315 278,326 325,336 372,343 419,350 466,355 513,360 560,364" fill="none" stroke="#D95319" stroke-width="3"/>
    <circle cx="325" cy="269" r="5" fill="#0072BD"/><circle cx="325" cy="336" r="5" fill="#D95319"/>
    <text x="333" y="263" font-size="11" fill="#0072BD">2.97 m/s</text><text x="333" y="351" font-size="11" fill="#D95319">1.66 m/s</text>

    <text x="885" y="82" text-anchor="middle" font-size="17" font-weight="700">Ideal heat-transfer requirement</text>
    <line x1="650" y1="420" x2="1120" y2="420" stroke="#374151"/><line x1="650" y1="90" x2="650" y2="420" stroke="#374151"/>
    <g stroke="#e5e7eb"><line x1="650" y1="357" x2="1120" y2="357"/><line x1="650" y1="294" x2="1120" y2="294"/><line x1="650" y1="231" x2="1120" y2="231"/><line x1="650" y1="169" x2="1120" y2="169"/><line x1="650" y1="106" x2="1120" y2="106"/></g>
    <g font-size="11" fill="#6b7280" text-anchor="end"><text x="642" y="424">80</text><text x="642" y="361">120</text><text x="642" y="298">160</text><text x="642" y="235">200</text><text x="642" y="173">240</text><text x="642" y="110">280</text></g>
    <g font-size="11" fill="#6b7280" text-anchor="middle"><text x="650" y="440">5</text><text x="744" y="440">7</text><text x="838" y="440">9</text><text x="932" y="440">11</text><text x="1026" y="440">13</text><text x="1120" y="440">15</text></g>
    <text x="885" y="466" text-anchor="middle" font-size="13">Assumed air temperature rise (°C)</text>
    <text x="596" y="255" text-anchor="middle" font-size="13" transform="rotate(-90 596 255)">Required ideal UA (W/K)</text>
    <line x1="885" y1="90" x2="885" y2="420" stroke="#6b7280" stroke-dasharray="5 5"/><text x="891" y="105" font-size="11" fill="#6b7280">10°C baseline</text>
    <polyline points="650,280 697,271 744,261 791,250 838,238 885,224 932,208 979,190 1026,170 1073,145 1120,114" fill="none" stroke="#0072BD" stroke-width="3"/>
    <polyline points="650,401 697,396 744,391 791,385 838,378 885,371 932,362 979,353 1026,342 1073,328 1120,312" fill="none" stroke="#D95319" stroke-width="3"/>
    <circle cx="885" cy="224" r="5" fill="#0072BD"/><circle cx="885" cy="371" r="5" fill="#D95319"/>
    <text x="893" y="218" font-size="11" fill="#0072BD">204.8 W/K</text><text x="893" y="386" font-size="11" fill="#D95319">111.3 W/K</text>

    <g font-size="12"><line x1="390" y1="490" x2="420" y2="490" stroke="#0072BD" stroke-width="3"/><text x="427" y="494">Sustained 10% grade</text><line x1="615" y1="490" x2="645" y2="490" stroke="#D95319" stroke-width="3"/><text x="652" y="494">Low-speed hot-weather grade</text></g>
  </g>
</svg>
