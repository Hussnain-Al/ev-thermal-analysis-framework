name: MATLAB checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink

      - name: Run framework and regression checks
        uses: matlab-actions/run-command@v3
        with:
          command: results = verify_framework;

      - name: Generate and compile battery-loop Simulink model
        uses: matlab-actions/run-command@v3
        with:
          command: setup_project(); run_battery_loop_simulink_checks;

      - name: Upload generated result plots
        uses: actions/upload-artifact@v4
        with:
          name: matlab-results
          path: outputs/
          if-no-files-found: error
